[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-algorithms-deep-dive"
version = "1.0.0"
description = "Educational deep dive into classic machine-learning algorithms with from-scratch implementations, benchmarks, tests, and visualizations."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "ML Algorithms Deep Dive Contributors" }
]
keywords = ["machine-learning", "algorithms", "education", "numpy", "scikit-learn"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies (pinned to compatible major/minor ranges).
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "nbformat>=0.2",
]
notebook = [
  "jupyter>=1.0",
  "xgboost>=2.0",
  "lightgbm>=4.0",
]

[tool.setuptools]
# This repository is a collection of self-contained algorithm modules rather
# than an installable single package; discovery is disabled intentionally.
packages = []

# ---------------------------------------------------------------------------
# Pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "ml-algorithms-deep-dive"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage configuration
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["ml-algorithms-deep-dive"]
omit = ["*/tests/*", "*/notebooks/*", "*/visualizations/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
